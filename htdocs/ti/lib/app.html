<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style><title>Setor de TI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral verde-escura (vira abas no celular), topo com trilha e busca, cabeçalho de página com ações,
   cartões de indicadores, tabela à esquerda e rosca à direita. Ficha e formulário abrem em tela cheia. */
:root{
  --side:#0E2A4A; --side-2:#16395F; --side-ink:#E6EEF8; --side-mute:#93AECB; --side-line:#244A74;
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#14202E; --mute:#637083; --line:#E0E5EC; --head:#F8F9FC;
  --accent:#1F4E8C; --accent-ink:#FFFFFF; --accent-soft:#E1EAF6;
  --ok:#2E7D52; --ok-soft:#E2F1E8; --warn:#9A6209; --warn-soft:#FBEBCF; --crit:#B83A2A; --crit-soft:#FADFDA;
  --d1:#1F4E8C; --d2:#4A7CBA; --d3:#89AEDB; --d4:#BDD2EA; --d5:#E1EAF6;
  --shadow:0 1px 2px rgba(20,32,46,.05);
  --f-sans:Arial,"Liberation Sans",Helvetica,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --side:#0A1A30; --side-2:#11294A; --side-ink:#E6EEF8; --side-mute:#93AECB; --side-line:#1D3A5E;
  --bg:#0D1420; --surface:#151E2D; --ink:#E6ECF5; --mute:#93A1B5; --line:#243249; --head:#111A28;
  --accent:#7FA8E8; --accent-ink:#08162B; --accent-soft:#1A2D4D;
  --ok:#5CC38A; --ok-soft:#173326; --warn:#E3AE56; --warn-soft:#3A2B10; --crit:#F0806F; --crit-soft:#42201B;
  --d1:#7FA8E8; --d2:#5F8CCF; --d3:#4670AC; --d4:#335585; --d5:#273F66; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --side:#0A1A30; --side-2:#11294A; --side-ink:#E6EEF8; --side-mute:#93AECB; --side-line:#1D3A5E;
  --bg:#0D1420; --surface:#151E2D; --ink:#E6ECF5; --mute:#93A1B5; --line:#243249; --head:#111A28;
  --accent:#7FA8E8; --accent-ink:#08162B; --accent-soft:#1A2D4D;
  --ok:#5CC38A; --ok-soft:#173326; --warn:#E3AE56; --warn-soft:#3A2B10; --crit:#F0806F; --crit-soft:#42201B;
  --d1:#7FA8E8; --d2:#5F8CCF; --d3:#4670AC; --d4:#335585; --d5:#273F66; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.tnum{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.app{min-height:100vh}
aside.side{display:none}
.col{min-width:0}
@media(min-width:900px){
  .app{display:grid;grid-template-columns:252px minmax(0,1fr)}
  aside.side{display:flex;flex-direction:column;gap:20px;background:var(--side);color:var(--side-ink);padding:24px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;align-self:start}
  nav.tabs{display:none!important}
}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}
.brand .lg{width:38px;height:38px;color:var(--side-ink)}
.brand b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1}
.brand span{display:block;font:500 10.5px/1.5 var(--f-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--side-mute);margin-top:6px}
.ws{border:1px solid var(--side-line);background:var(--side-2);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:flex-start}
.ws b{display:block;font-size:14px}.ws span{font-size:12.5px;color:var(--side-mute);line-height:1.35;display:block}
.sec{font:700 12px/1 var(--f-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--side-mute);padding:6px 8px 0}
.snav{display:grid;gap:4px}
.snav button{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:10px;padding:12px;color:var(--side-ink);font-size:16px;font-weight:500;text-align:left;position:relative}
.snav button:hover{background:var(--side-2)}
.snav button[aria-current=page]{background:var(--side-2)}
.snav button[aria-current=page]::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--side-ink)}
.sidenote{margin-top:auto;border:1px solid var(--side-line);background:var(--side-2);border-radius:12px;padding:12px;font-size:12.5px;color:var(--side-mute);line-height:1.45}
.sidenote b{display:block;color:var(--side-ink);font-size:13px;margin-bottom:4px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{display:flex;align-items:center;gap:12px;min-height:60px}
.crumb{font-size:14.5px;color:var(--mute);display:flex;gap:10px;align-items:center;min-width:0;white-space:nowrap}
.crumb b{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.crumb .mh{display:none}
@media(max-width:899px){.crumb b,.crumb .dk{display:none}.crumb .mh{display:inline;color:var(--ink);font-weight:700;font-size:16px}}
.spacer{flex:1;min-width:0}
.th{width:36px;height:36px}
.gs{display:none;align-items:center;gap:8px;color:var(--mute);width:min(320px,34vw)}
.gs input{border:0;background:none;outline:0;width:100%;font-size:14px;padding:6px 0}
@media(min-width:900px){.gs{display:flex}}
.amenu{position:absolute;right:16px;top:calc(100% + 6px);width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:14px;z-index:40}
.amenu b{display:block}.amenu .am-s{font-size:12px;color:var(--mute);margin-top:2px}
.amenu .am-h{font:700 11px/1 var(--f-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px}
.amenu button.am,.amenu a.am{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;padding:10px;border:0;background:transparent;border-radius:8px;text-align:left;cursor:pointer;font-size:15px}
.amenu button.am:hover,.amenu a.am:hover,.amenu button.am[aria-pressed=true]{background:var(--accent-soft)}
.amenu .am-n{font-size:12px;color:var(--mute);margin-top:12px;line-height:1.4;border-top:1px solid var(--line);padding-top:10px}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 11px/1 var(--f-sans);letter-spacing:.02em;flex:none}
.chip{font:500 11px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:6px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.ro{background:var(--line);color:var(--mute)}

main{max-width:1240px;margin:0 auto;padding-block:24px 120px}
@media(min-width:900px){main{padding-block:32px 48px}}
.ph{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.eyebrow{font:700 12.5px/1 var(--f-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.ph h1{margin:0;font-size:34px;line-height:1.05;letter-spacing:-.025em;font-weight:600}
.ph p{margin:10px 0 0;color:var(--mute)}
@media(max-width:560px){.ph h1{font-size:26px}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600;white-space:nowrap;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dng{color:var(--crit);border-color:var(--crit)}
.btn.dng.on{background:var(--crit);color:#fff}
.btn:disabled{opacity:.5}
.only-d{display:none}@media(min-width:900px){.only-d{display:inline-flex}}

.kpis{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-bottom:16px}
@media(min-width:900px){.kpis{grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;text-align:left;display:block;width:100%;min-width:0;box-shadow:var(--shadow)}
button.kpi:hover{border-color:var(--accent)}
.kpi .h{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:14.5px;gap:8px}
.kpi .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.kpi .ic.c{background:var(--crit-soft);color:var(--crit)}.kpi .ic.w{background:var(--warn-soft);color:var(--warn)}
.kpi .v{font-size:32px;font-weight:600;letter-spacing:-.02em;margin:14px 0 8px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13.5px;color:var(--mute)}
@media(max-width:560px){.kpi{padding:14px}.kpi .v{font-size:28px}}

.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:1000px){.grid.main2{grid-template-columns:minmax(0,1.85fr) minmax(0,1fr)}.grid.two{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0;box-shadow:var(--shadow)}
.card .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 14px}
.card .hd h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.card .hd p{margin:4px 0 0;font-size:14px;color:var(--mute)}
.card .bd{padding:0 20px 20px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:13.5px;padding:2px 0;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
@media(max-width:560px){.card .hd{padding:16px 16px 12px}.card .bd{padding:0 16px 16px}}

.thead,.trow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1.9fr) 104px 22px;gap:14px;align-items:center;padding:12px 20px}
.thead{background:var(--head);border-top:1px solid var(--line);border-bottom:1px solid var(--line);font:700 12px/1 var(--f-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding-block:13px}
.trow{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--head)}
.tile{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;color:var(--mute);flex:none;background:var(--head)}
.who span.tile{display:grid;place-items:center;overflow:visible;white-space:normal;font:inherit;color:var(--mute)}
.gcard .who span.tile{color:#fff}
.eqg{grid-template-columns:minmax(0,1.3fr) minmax(0,1.1fr) 160px 120px 22px}
@media(max-width:899px){.eqg{grid-template-columns:1fr}.thead.eqg{display:none}}
.who{display:flex;gap:12px;align-items:center;min-width:0}
.who b{display:block;font-weight:700;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span,.cell-s{display:block;font:400 13px/1.4 var(--f-mono);color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arr{color:var(--mute)}
.cell.c3{white-space:normal;line-height:1.35}
@media(max-width:899px){
  .thead{display:none}
  .trow{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:14px 16px}
  .trow .who{grid-column:1}.trow .st{grid-column:2;grid-row:1}
  .trow .c2,.trow .c3{grid-column:1/-1;white-space:normal}
  .trow .arr{display:none}
}
.pill{display:inline-block;font:700 13px/1 var(--f-sans);padding:5px 9px;border-radius:6px;white-space:nowrap}
.pill.sub{background:var(--crit-soft);color:var(--crit)}.pill.atu{background:var(--warn-soft);color:var(--warn)}.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.st{background:var(--line);color:var(--mute)}
.pill.s-uso{background:var(--ok-soft);color:var(--ok)}
.pill.s-estoque{background:var(--accent-soft);color:var(--accent)}
.pill.s-manutencao{background:var(--warn-soft);color:var(--warn)}
.pill::before{content:"• "}

.donut{display:grid;place-items:center;margin:4px 0 16px}
.donut svg{width:176px;height:176px}
.donut .tx{fill:var(--ink);font:600 28px var(--f-sans)}.donut .t2{fill:var(--mute);font:500 12px var(--f-sans)}
.lg2{display:grid;gap:10px}
.lg2 div{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--mute)}
.lg2 i{width:8px;height:8px;border-radius:2px;flex:none}
.lg2 b{margin-left:auto;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:100px 1fr 34px;gap:10px;align-items:center;font-size:14px}
.bar .lb{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar .fl{height:100%;border-radius:5px;background:var(--d1);display:block}
.bar .fl.c{background:var(--crit)}.bar .fl.w{background:var(--warn)}.bar .fl.o{background:var(--ok)}
.bar .n{text-align:right;font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.sub-h{margin:20px 0 10px;font:700 12px/1 var(--f-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.sitbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--line)}
.sitbar button{border:0;padding:0;min-width:4px}
.sit-sub{background:var(--crit)}.sit-atu{background:var(--warn)}.sit-ok{background:var(--ok)}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.legend>div,.legend button{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left;min-width:0}
.legend b{display:block;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.legend span{font-size:13px;color:var(--mute)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.note{font-size:13.5px;color:var(--mute);margin:12px 0 0}

.tools{display:flex;gap:8px;padding:0 20px 14px}
@media(max-width:560px){.tools{padding:0 16px 12px}}
@media(min-width:900px){.tools .search{display:none}}
.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:16px}
.filters{display:none;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 14px}
.filters.open{display:grid}
@media(min-width:900px){.filters{grid-template-columns:repeat(3,minmax(0,240px))}}
@media(max-width:560px){.filters{padding:0 16px 12px}}
.filters label,.fld label{display:block;font:700 12px/1 var(--f-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
select,input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;font-size:16px;min-width:0}
.count{font-size:13.5px;color:var(--mute);padding:0 20px 10px;display:flex;justify-content:space-between}
@media(max-width:560px){.count{padding:0 16px 10px}}
.count button{background:none;border:0;color:var(--accent);padding:0;font-size:12.5px;font-weight:600}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

details.loc{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;box-shadow:var(--shadow)}
details.loc>summary,details.und>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px 20px}
details summary::-webkit-details-marker{display:none}
details.loc>summary h3{margin:0;font-size:17px;font-weight:600}
details.und{border-top:1px solid var(--line)}
details.und>summary{padding:11px 20px;background:var(--head);font:600 11px/1 var(--f-sans);letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.cnt{font:500 12px/1 var(--f-mono);color:var(--mute);margin-left:auto}
.setor{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 20px;text-align:left}
.setor:hover{background:var(--head)}
.setor .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.mini{display:flex;width:60px;height:8px;border-radius:4px;overflow:hidden;gap:1px;background:var(--line)}

.trail{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:14.5px;color:var(--mute)}
.trail button{background:none;border:0;color:var(--accent);font-weight:700;padding:2px 0;font-size:inherit}
.trail b{color:var(--ink)}
.gcards{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.gcard:hover{border-color:var(--accent)}
.gh{display:flex;gap:12px;align-items:center;min-width:0}
.gt{min-width:0}.gt b{display:block;font-size:17px;overflow-wrap:anywhere}.gt span{display:block;font-size:13px;color:var(--mute)}
.gn{font-size:34px;font-weight:700;line-height:1;letter-spacing:-.02em}
.gn small{font-size:13px;font-weight:400;color:var(--mute);margin-left:8px;letter-spacing:0}
.sbar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:1px;background:var(--line)}.sbar span{height:100%}
.gl{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mute)}
.gl i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
@media(max-width:560px){.gcards{grid-template-columns:1fr 1fr;gap:12px}.gcard{padding:14px;gap:12px}.gh .tile{display:none}.gt b{font-size:16px}.gn{font-size:28px}.gn small{display:block;margin:4px 0 0}}
/* cards de destaque (indicadores e locais/setores) em azul escuro */
.kpi,.gcard{--t-bg:#1B4378;--t-line:#2C5C9A;--t-ink:#FFFFFF;--t-mute:#B4C7E0;--t-sub:#FF8A7A;--t-atu:#F5B84F;--t-ok:#5CC38A;background:var(--t-bg);border-color:var(--t-line);color:var(--t-ink);box-shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi,:root:not([data-theme="light"]) .gcard{--t-bg:#1C3358;--t-line:#2B4A7A}}
:root[data-theme="dark"] .kpi,:root[data-theme="dark"] .gcard{--t-bg:#1C3358;--t-line:#2B4A7A}
button.kpi:hover,.gcard:hover{border-color:var(--t-ink)}
.kpi .h,.kpi .s,.gt span,.gn small,.gl{color:var(--t-mute)}
.gt b,.gn{color:var(--t-ink)}
.kpi .ic{background:rgba(255,255,255,.14);color:#fff}
.kpi .ic.c{background:rgba(255,255,255,.14);color:var(--t-sub)}.kpi .ic.w{background:rgba(255,255,255,.14);color:var(--t-atu)}
.gcard .tile{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:#fff}
.gcard .sbar{background:rgba(255,255,255,.18)}
.gcard .sit-sub,.gcard .sbar .sit-sub{background:var(--t-sub)}.gcard .sit-atu{background:var(--t-atu)}.gcard .sit-ok{background:var(--t-ok)}
.urow{display:grid;grid-template-columns:minmax(0,1.6fr) 190px auto;gap:14px;align-items:center;padding:12px 20px;border-top:1px solid var(--line)}

<script>
(function(){
"use strict";
const PLAT={"Intel Legado I":2007,"Intel Legado II":2008,"Intel Legado III":2009,"Intel 1ª Geração":2010,"Intel 2ª Geração":2011,"Intel 3ª Geração":2012,"Intel 4ª Geração":2013,"Intel 5ª Geração":2014,"Intel 6ª Geração":2015,"Intel 7ª Geração":2016,"Intel 8ª Geração":2017,"Intel 9ª Geração":2018,"Intel 10ª Geração":2019,"Intel Braswell":2015,"Intel Bay Trail":2013,"A-Series":2014,"Ryzen 3000":2019,"Ryzen 5000":2020,"Ryzen 7000":2022};
const STATUS=["em uso","estoque","manutenção","baixado"];
const FIELD_LABEL={patrimonio:"Patrimônio",local:"Local",und:"Unidade",setor:"Setor",usuario:"Usuário",status:"Status",mbMarca:"Placa-mãe",mbModelo:"Modelo da placa",cpu:"Processador",plataforma:"Plataforma",ram:"Memória",ramFreq:"Frequência",ramTipo:"Tipo de RAM",ssdCap:"SSD",ssdModelo:"Modelo SSD",ssdMarca:"Marca SSD",fonteW:"Fonte (W)",fonteMarca:"Marca da fonte",monMarca:"Monitor",monTam:"Tela",monModelo:"Modelo do monitor",obs:"Observações"};
const TABS={painel:["Visão geral","Seu parque, em perspectiva","Acompanhe computadores, redes e projetores e o que precisa de atenção."],
  lista:["Computadores","Inventário por local","Escolha um local e depois o setor para ver as máquinas. A busca procura em todo o parque."],
  usuarios:["Painel de controle","Administração","Crie contas, defina a função de cada pessoa e redefina senhas."],
  redes:["Redes e conectividade","Inventário","Switches, roteadores, access points, links de internet e demais equipamentos de rede."],
  projetores:["Projetores","Inventário","Projetores das salas, auditórios e laboratórios, com horas de lâmpada e situação."],
  os:["Ordens de serviço","Pedidos recebidos","Pedidos de alunos, professores e diretores. Assuma, agende e conclua."],
  manut:["Manutenção","Central de manutenção","Solicite, agende e acompanhe as manutenções dos computadores."],
  solicitar:["Solicitar manutenção","Manutenção","Escolha o computador, o tipo de manutenção e, se quiser, o dia."],
  agendamentos:["Agendamentos","Manutenção","Manutenções solicitadas e em andamento."],
  historico:["Histórico","Manutenção","Manutenções concluídas."],
  ajuda:["Como funciona","Regras e acessos","Como a situação é calculada e quem pode editar."]};

const $=s=>document.querySelector(s);
const main=$("#main"), sheet=$("#sheet"), fab=$("#fab");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nat=(a,b)=>String(a).localeCompare(String(b),"pt-BR",{numeric:true,sensitivity:"base"});
const ic=(n,cls)=>`<svg class="i${cls?" "+cls:""}"><use href="#i-${n}"/></svg>`;

let db=null,userCap=null,canWrite=false,loaded=false,loadErr="",realAdmin=false,meName="";
let pcs=[], tab="painel";
let F={q:"",local:"",setor:"",sit:"",ramTipo:"",status:""};
let filtersOpen=false;

/* ---------- regras de situação ---------- */
const ramTotal=p=>(p.ram||[]).reduce((s,r)=>s+(+r.gb||0),0);
function reasons(p){
  const sub=[],atu=[],t=ramTotal(p),ano=+p.ano||PLAT[p.plataforma]||0;
  if(ano&&ano<=2009)sub.push("CPU de "+ano);
  if(p.ramTipo==="DDR2")sub.push("Memória DDR2");
  if(t>0&&t<4)sub.push("Só "+t+" GB de RAM");
  if(ano>=2010&&ano<=2012)atu.push("CPU "+(p.plataforma||ano));
  if(t>=4&&t<8)atu.push("RAM abaixo de 8 GB");
  return {sub,atu};
}
function sit(p){const r=reasons(p);return r.sub.length?"sub":r.atu.length?"atu":"ok"}
const SIT_LABEL={sub:"Substituir",atu:"Atualizar",ok:"Adequado"};
const cpuShort=c=>String(c||"").replace(/^Intel /,"").replace(/^AMD /,"").replace(/ - /," ").replace(/\s+/g," ").trim();
const specLine=p=>[cpuShort(p.cpu),ramTotal(p)?ramTotal(p)+" GB "+(p.ramTipo||""):"",p.ssdCap||""].filter(Boolean).join(" · ");
const nameOf=p=>p.usuario||p.setor||p.id;
const fmtDate=iso=>{try{const d=new Date(iso);return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"})+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}catch(e){return iso}};
const uniq=k=>[...new Set(pcs.map(p=>p[k]).filter(Boolean))].sort(nat);
const pct=(a,b)=>(a/b*100).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";

/* ---------- navegação ---------- */
function setTab(t){
  if(["os","agendamentos","historico","usuarios"].includes(t)&&!isAdmin)t="painel";
  if(t==="usuarios"&&!isSuper)t="painel";
  if(t==="manut"&&!isAdmin)t="solicitar";
  if(restricted()&&!["solicitar","ajuda"].includes(t))t="solicitar";
  tab=t; try{history.replaceState(null,"","#"+t)}catch(e){}
  const nt=({solicitar:"manut",agendamentos:"manut",historico:"manut"})[t]||t;
  document.querySelectorAll("[data-tab]").forEach(b=>{if(b.dataset.tab===nt)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  $("#crumb").textContent=nt!==t?"Manutenção › "+TABS[t][0]:TABS[t][0];
  render(); window.scrollTo(0,0);
}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200)}

/* ---------- render ---------- */
function pageHead(){
  const [h,e,s]=TABS[tab];
  return `<div class="ph"><div><div class="eyebrow">${esc(e)}</div><h1>${esc(h)}</h1><p>${esc(s)}</p></div>${canWrite&&(tab==="painel"||tab==="lista")?`<button class="btn pri only-d" data-a="new">${ic("plus")}Novo computador</button>`:""}${canWrite&&EQ[tab]?`<button class="btn pri" data-a="eqnew">${ic("plus")}Novo ${EQ[tab].um}</button>`:""}</div>`;
}
function render(){

function filtered(){
  const q=F.q.trim().toLowerCase();
  return pcs.filter(p=>{
    if(F.local&&p.local!==F.local)return false;
    if(F.setor&&p.setor!==F.setor)return false;
    if(F.sit&&sit(p)!==F.sit)return false;
    if(F.ramTipo&&p.ramTipo!==F.ramTipo)return false;
    if(F.status&&(p.status||"em uso")!==F.status)return false;
    if(q){const hay=[p.id,p.patrimonio,p.local,p.und,p.setor,p.usuario,p.cpu,p.mbMarca,p.mbModelo,p.monMarca,p.monModelo,p.obs].join(" ").toLowerCase();if(!hay.includes(q))return false}
    return true;
  }).sort((a,b)=>nat(a.local,b.local)||nat(a.setor,b.setor)||nat(a.usuario,b.usuario));
}
const activeFilters=()=>["sit","ramTipo","status"].filter(k=>F[k]).length;
const isFlat=()=>!!(F.q.trim()||F.sit||F.ramTipo||F.status);
function opts(list,cur,all){return `<option value="">${all}</option>`+list.map(v=>`<option value="${esc(v)}"${v===cur?" selected":""}>${esc(v)}</option>`).join("")}

const groupBy=(arr,fn)=>{const m=new Map();arr.forEach(p=>{const k=fn(p);if(!m.has(k))m.set(k,[]);m.get(k).push(p)});return m};
const sitCounts=a=>{const c={sub:0,atu:0,ok:0};a.forEach(p=>c[sit(p)]++);return c};
const sitBar=a=>{const c=sitCounts(a);return `<span class="sbar" aria-hidden="true">`+["sub","atu","ok"].map(k=>c[k]?`<span class="sit-${k}" style="width:${c[k]/a.length*100}%"></span>`:"").join("")+`</span>`};
const sitNotes=a=>{const c=sitCounts(a);return (c.sub?`<span><i class="sit-sub"></i>${c.sub} substituir</span>`:"")+(c.atu?`<span><i class="sit-atu"></i>${c.atu} atualizar</span>`:"")+(c.ok?`<span><i class="sit-ok"></i>${c.ok} adequado${c.ok>1?"s":""}</span>`:"")};
const gcard=(icon,title,sub,list,attrs)=>`<button class="gcard" ${attrs}><div class="gh"><span class="tile">${ic(icon)}</span><div class="gt"><b>${esc(title)}</b><span>${esc(sub)}</span></div></div><div class="gn tnum">${list.length}<small>computador${list.length===1?"":"es"}</small></div>${sitBar(list)}<div class="gl">${sitNotes(list)}</div></button>`;
const trail=()=>!F.local?"":`<div class="trail"><button data-a="drill" data-l="" data-s="">Todos os locais</button><span>›</span>${F.setor?`<button data-a="drill" data-l="${esc(F.local)}" data-s="">${esc(F.local)}</button><span>›</span><b>${esc(F.setor)}</b>`:`<b>${esc(F.local)}</b>`}</div>`;

    const a=pcs.filter(p=>(p.local||"Sem local")===F.local);

  }else{
    const r=filtered();
    el.innerHTML=trail()+`<div class="card"><div class="hd"><div><h2>${esc(F.setor)}</h2><p>${esc(F.local)} · ${r.length} computador${r.length===1?"":"es"}</p></div></div>`+

  }
}

function drawRam(){
  const el=$("#pentes"); if(!el)return;
  el.innerHTML=formRam.map((r,i)=>`<div class="pente"><div><label class="muted" style="font-size:11px" for="rg${i}">GB</label><input type="number" inputmode="numeric" id="rg${i}" data-ram="gb" data-i="${i}" value="${esc(r.gb)}"></div><div><label class="muted" style="font-size:11px" for="rm${i}">Marca (slot ${i+1})</label><input type="text" id="rm${i}" data-ram="marca" data-i="${i}" value="${esc(r.marca)}"></div><button type="button" class="x sm" data-a="delram" data-i="${i}" aria-label="Remover pente ${i+1}">${ic("x")}</button></div>`).join("");
  $("#addram").hidden=formRam.length>=4; showTot();
}
const showTot=()=>{const t=formRam.reduce((s,r)=>s+(+r.gb||0),0);const e=$("#tot");if(e)e.textContent="Total: "+t+" GB"};
const showAno=()=>{const e=$("#ano"),s=$("#f_plataforma");if(e&&s)e.textContent=s.value?"Ano da CPU: "+PLAT[s.value]:""};
const val=id=>($("#"+id)?.value||"").trim().replace(/\s+/g," ");

async function save(){
  const err=$("#err"); err.hidden=true;
  const local=val("f_local"), setor=val("f_setor");
  if(!local||!setor){err.textContent="Informe o local e o setor.";err.hidden=false;err.scrollIntoView({block:"center"});return}
  const plat=val("f_plataforma");
  const o={patrimonio:val("f_patrimonio"),local,und:val("f_und"),setor,usuario:val("f_usuario"),status:$("#f_status").value,
    mbMarca:val("f_mbMarca"),mbModelo:val("f_mbModelo"),cpu:val("f_cpu"),plataforma:plat,ano:PLAT[plat]||0,
    ram:formRam.filter(r=>+r.gb>0).map(r=>({gb:+r.gb,marca:String(r.marca||"").trim()})),ramTipo:$("#f_ramTipo").value,ramFreq:val("f_ramFreq"),
    ssdCap:val("f_ssdCap"),ssdModelo:val("f_ssdModelo"),ssdMarca:val("f_ssdMarca"),fonteW:+val("f_fonteW")||0,fonteMarca:val("f_fonteMarca"),
    monMarca:val("f_monMarca"),monTam:val("f_monTam"),monModelo:val("f_monModelo"),obs:$("#f_obs").value.trim()};
  const now=new Date().toISOString(); let uid=null; try{uid=userCap?await userCap.id():null}catch(e){}
  const btn=$("#savebtn"); btn.disabled=true;
  try{
    if(editing){
      const ch=[];
      for(const k of Object.keys(FIELD_LABEL)){
        const a=editing[k]??(k==="ram"?[]:""), b=o[k];
        if(JSON.stringify(a)!==JSON.stringify(b)){
          const f=x=>k==="ram"?(x.length?x.map(r=>r.gb).join("+")+" GB":"vazio"):(x===""||x===0?"vazio":x);
          ch.push(FIELD_LABEL[k]+": "+f(a)+" → "+f(b));
        }
      }
      if(!ch.length){toast("Nada foi alterado");closeSheetThen(editing.id);return}
      const hist=[...(editing.historico||[]),{t:now,by:uid,msg:ch.slice(0,6).join("; ")+(ch.length>6?" e mais "+(ch.length-6):"")}].slice(-200);
      await db.doc("pcs/"+editing.id).set({...o,historico:hist,updated:now});
      toast("Alterações salvas"); closeSheetThen(editing.id);
    }else{
      let n=pcs.reduce((m,p)=>Math.max(m,parseInt(String(p.id).replace(/\D/g,""))||0),0)+1, id, done=false;
      for(let tries=0;tries<5&&!done;tries++){
        id="PC-"+String(n).padStart(4,"0");
        try{ const ex=await db.doc("pcs/"+id).get(); if(ex.exists){n++;continue}
          await db.doc("pcs/"+id).set({...o,historico:[{t:now,by:uid,msg:"Cadastro do computador"}],updated:now}); done=true }catch(e){ if(tries===4)throw e; n++ }
      }
      toast(id+" cadastrado"); closeSheetThen(id);
    }
  }catch(e){
    btn.disabled=false; err.textContent="Não foi possível salvar"+(e&&e.code==="invalid_argument"?": você não tem permissão de edição.":". Tente de novo."); err.hidden=false;
  }
}
function closeSheetThen(id){ setTimeout(()=>openFicha(id),250) }

async function remove(){
  if(!cur)return; const b=$("#delbtn");
  if(!delArmed){delArmed=true;b.textContent="Confirmar exclusão";b.classList.add("on");setTimeout(()=>{if(delArmed&&b.isConnected){delArmed=false;b.textContent="Excluir";b.classList.remove("on")}},4000);return}
  try{await db.doc("pcs/"+cur.id).delete();toast(cur.id+" excluído");closeSheet()}catch(e){toast("Não foi possível excluir")}
}

/* ---------- eventos ---------- */
const NOF={q:"",local:"",setor:"",sit:"",ramTipo:"",status:""};
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a],[data-tab]"); if(!t)return;

  const a=t.dataset.a;

  else if(a==="new")openForm(null,true);

  else if(a==="dup"){const c=JSON.parse(JSON.stringify(cur));c.patrimonio="";c.usuario="";delete c.id;c.historico=[];openForm(c,true)}
  else if(a==="del")remove();
  else if(a==="save")save();
  else if(a==="addram"){formRam.push({gb:"",marca:""});drawRam()}
  else if(a==="delram"){formRam.splice(+t.dataset.i,1);if(!formRam.length)formRam.push({gb:"",marca:""});drawRam()}
  else if(a==="filters"){filtersOpen=!filtersOpen;$("#filters").classList.toggle("open",filtersOpen);t.setAttribute("aria-expanded",filtersOpen)}
  else if(a==="clear"){F={...NOF};$("#gq").value="";viewLista()}
  else if(a==="sit"){F={...NOF,sit:t.dataset.v};$("#gq").value="";setTab("lista")}
  else if(a==="drill"){F={...F,local:t.dataset.l,setor:t.dataset.s};results();window.scrollTo(0,0)}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"||t.id==="gq"){

const PREV=["Limpeza de hardware","Limpeza de software","Troca de pasta térmica","Preventiva"], CORR=["Formatação","Remoção de vírus","Outro","Corretiva","Formatação ou reinstalação"];
/* Plano preventivo (intervalos em meses). Referência: práticas de fabricantes e normas de gestão de ativos de TI (ITIL / ISO 55000)
   para ambiente escolar, com poeira e uso intenso. Preventiva genérica vale para limpeza de hardware e de software. */
const PLANO=[
 {k:"hw",nome:"Limpeza de hardware",meses:6,tipo:"Limpeza de hardware",conta:["Limpeza de hardware","Preventiva"],dica:"Poeira em coolers, fonte e dissipador"},
 {k:"sw",nome:"Limpeza de software",meses:6,tipo:"Limpeza de software",conta:["Limpeza de software","Preventiva","Formatação","Formatação ou reinstalação"],dica:"Atualizações, arquivos temporários e antivírus"},
 {k:"pt",nome:"Troca de pasta térmica",meses:24,tipo:"Troca de pasta térmica",conta:["Troca de pasta térmica"],dica:"Pasta resseca com o tempo e aquece o processador"}
];
const addMes=(d,n)=>{const x=new Date(d);x.setMonth(x.getMonth()+n);return x};
function plano(p){
  const done=manut.filter(m=>m.pcId===p.id&&m.status==="concluída");
  const key=m=>m.concluidaEm||m.data||"";
  return PLANO.map(it=>{
    const u=done.filter(m=>it.conta.includes(m.tipo)).map(key).sort().pop()||"";
    if(!u)return {...it,ultima:"",st:"sem",txt:"Sem registro",cls:"atu"};
    const venc=addMes(u,it.meses), dias=Math.round((venc-Date.now())/864e5);
    const st=dias<0?"venc":dias<=30?"prox":"ok";
    return {...it,ultima:u,venc:venc.toISOString(),dias,st,
      txt:st==="venc"?"Vencida há "+(-dias)+(dias===-1?" dia":" dias"):st==="prox"?"Vence em "+dias+(dias===1?" dia":" dias"):"Em dia · próxima em "+fd(venc.toISOString()),
      cls:st==="venc"?"sub":st==="prox"?"atu":"ok"};
  });
}

/* ---------- saúde ---------- */
function health(p){
  let sc=100; const why=[], now=Date.now(), yr=365*864e5;
  const s=sit(p); if(s==="sub"){sc-=40;why.push("Hardware ultrapassado")}else if(s==="atu"){sc-=15;why.push("Hardware a atualizar")}
  const open=osAll().filter(o=>o.pcId===p.id&&!["concluída","cancelada"].includes(o.status)).length;
  if(open){sc-=Math.min(30,open*15);why.push(open+" OS aberta"+(open>1?"s":""))}
  const done=manut.filter(m=>m.pcId===p.id&&m.status==="concluída");
  const key=m=>m.concluidaEm||m.data||"";
  const corr=done.filter(m=>CORR.includes(m.tipo)&&now-new Date(key(m))<yr).length;
  if(corr){sc-=Math.min(30,corr*10);why.push(corr+" reparo"+(corr>1?"s":"")+" em 12 meses")}
  const venc=plano(p).filter(i=>i.st==="venc");
  if(venc.length){sc-=Math.min(20,venc.length*10);why.push("Preventiva vencida: "+venc.map(i=>i.nome.toLowerCase()).join(", "))}
  const last=done.map(key).sort().pop()||"";
  sc=Math.max(0,sc);
  return {sc,why,last,label:sc>=75?"Boa":sc>=50?"Atenção":"Crítica",cls:sc>=75?"ok":sc>=50?"atu":"sub"};
}
function fichaManut(p,nm){
  nm=nm||{};
  const h=health(p), pl=plano(p);

  const linked=new Set(manut.filter(m=>m.osId).map(m=>m.osId));
  const os=osAll().filter(o=>o.pcId===p.id&&!linked.has(o.id)).map(o=>({t:o.atualizadoEm||o.criadoEm||"",tipo:o.tipo,st:o.status,txt:o.descricao||"Sem detalhes",os:o.id,soOS:1,por:o.status==="concluída"?o.concluidoPor:"",resp:o.tecnicoId}));
  const ev=[...ms,...os].sort((a,b)=>String(b.t).localeCompare(String(a.t)));
  const mark=e=>e.os?` <span class="pill st">OS</span>`:"";
  const algum=pl.some(i=>i.st==="venc"), prox=pl.some(i=>i.st==="prox"), sem=pl.every(i=>i.st==="sem");
  const resumo=algum?["sub","Preventiva vencida"]:prox?["atu","Preventiva próxima"]:sem?["atu","Sem histórico preventivo"]:pl.some(i=>i.st==="sem")?["atu","Preventiva em dia, com itens sem registro"]:["ok","Preventiva em dia"];
  return `<div class="card"><h2>Saúde e manutenção</h2><div><span class="pill ${h.cls}">Saúde ${h.label}</span> <span class="muted">${h.sc} de 100</span></div>
    ${h.why.length?`<div class="reasons">${h.why.map(w=>`<span class="pill st">${esc(w)}</span>`).join("")}</div>`:""}</div>
    <div class="card"><h2>Manutenção preventiva</h2><div><span class="pill ${resumo[0]}">${resumo[1]}</span></div>
    <div class="hist" style="margin-top:14px">${pl.map(i=>`<div><span class="w">${esc(i.nome)} · a cada ${i.meses} meses</span><span class="pill ${i.cls}">${esc(i.txt)}</span>
      <span class="muted" style="display:block;margin-top:4px">${i.ultima?"Última: "+fd(i.ultima):"Nunca registrada no sistema"} · ${esc(i.dica)}</span>
      ${canWrite&&i.st!=="ok"?`<button class="btn" style="margin-top:8px" data-a="agpc" data-id="${esc(p.id)}" data-tipo="${esc(i.tipo)}" data-back="1">Agendar ${esc(i.nome.toLowerCase())}</button>`:""}</div>`).join("")}</div></div>
    <div class="card"><h2>Histórico de manutenções</h2>
    ${ev.length?`<div class="hist">${ev.map(e=>`<div><span class="w">${fd(e.t)} · ${esc(e.tipo)} · ${esc(e.st)}</span>${mark(e)} ${esc(e.txt)}${e.por?`<span class="muted" style="display:block;margin-top:3px">Concluída por ${esc(pn(nm,e.por))}</span>`:e.resp&&e.st!=="cancelada"?`<span class="muted" style="display:block;margin-top:3px">Responsável: ${esc(pn(nm,e.resp))}</span>`:""}</div>`).join("")}</div>`:`<p class="muted" style="margin:0">Nenhuma manutenção ou ordem de serviço para este computador.</p>`}
    ${canWrite?`<button class="btn" style="margin-top:14px" data-a="agpc" data-id="${esc(p.id)}" data-back="1">Agendar manutenção</button>`:""}</div>`;
}

function eqForm(k,id){
  const c=EQ[k], e=id?eqData[k].find(x=>x.id===id):null; if(id&&!e)return;
  const sug=f=>f==="local"?[...new Set([...pcs.map(p=>p.local),...eqData.redes.map(x=>x.local),...eqData.projetores.map(x=>x.local)].filter(Boolean))].sort(nat)
    :f==="setor"?[...new Set([...pcs.map(p=>p.setor),...eqData.redes.map(x=>x.setor),...eqData.projetores.map(x=>x.setor)].filter(Boolean))].sort(nat)
    :[...new Set(eqData[k].map(x=>x.marca).filter(Boolean))].sort(nat);
  const fld=f=>{const v=e&&e[f.k]!==undefined?e[f.k]:(f.k==="status"?"Em uso":"");const idf="eq_f_"+f.k;
    const lab=`<label for="${idf}">${esc(f.l)}${f.req?" *":""}</label>`;
    if(f.t==="sel")return `<div class="fld">${lab}<select id="${idf}">${f.k==="tipo"||f.k==="instalacao"?`<option value="">Selecione</option>`:""}${f.o.map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
    if(f.t==="area")return `<div class="fld">${lab}<textarea id="${idf}" rows="3">${esc(v)}</textarea></div>`;
    return `<div class="fld">${lab}<input id="${idf}" type="${f.t==="num"?"number":"text"}"${f.t==="num"?' min="0" inputmode="numeric"':""}${f.dl?` list="dl-eq-${f.dl}"`:""} value="${esc(v)}" placeholder="${esc(f.ph||"")}" autocomplete="off"${f.m?' style="font-family:var(--f-mono)"':""}></div>`};
  sheet.hidden=false; document.body.style.overflow="hidden";
  sheet.innerHTML=`<div class="bar-top gut"><div class="in"><button class="x" data-a="eqcancel" aria-label="Voltar">${ic("x")}</button><div class="ttl"><small>${e?esc(e.id):"Novo cadastro"}</small>${e?"Editar "+esc(c.um):"Novo "+esc(c.um)}</div></div></div>
  <div class="body gut"><div class="in"><div class="card">${c.campos.map(fld).join("")}
   ${["local","setor","marca"].map(d=>`<datalist id="dl-eq-${d}">${sug(d).map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`).join("")}
   <div class="err" id="eq_err" hidden></div></div></div></div>
  <div class="foot gut"><div class="in"><button class="btn" data-a="eqcancel">Cancelar</button><button class="btn pri" data-a="eqsave" id="eq_save">Salvar</button></div></div>`;
  eqCur={k,id:id||null};
}
async function eqSave(){
  const {k,id}=eqCur||{}; if(!k)return; const c=EQ[k], err=$("#eq_err"), btn=$("#eq_save");
  const antes=id?eqData[k].find(x=>x.id===id):null, novo={};
  for(const f of c.campos){
    const el=$("#eq_f_"+f.k); let v=el?String(el.value||"").trim().replace(/[ \t]+/g," "):"";
    if(f.req&&!v){err.textContent="Preencha "+f.l.toLowerCase()+".";err.hidden=false;el&&el.focus();return}
    if(f.t==="num"&&v!==""){const n=Number(v);if(!isFinite(n)||n<0){err.textContent=f.l+" precisa ser um número.";err.hidden=false;return}v=n}
    novo[f.k]=v;
  }
  btn.disabled=true; err.hidden=true;
  try{
    const now=new Date().toISOString(); let docId=id;
    const hist=(antes&&antes.historico||[]).slice();
    if(!id){
      let n=eqData[k].reduce((m,x)=>Math.max(m,parseInt(String(x.id).replace(/\D/g,""))||0),0)+1, ok=false;
      for(let i=0;i<5&&!ok;i++){docId=c.prefix+"-"+String(n).padStart(4,"0");const ex=await db.doc(c.col+"/"+docId).get();if(ex.exists){n++;continue}ok=true}
      if(!ok)throw new Error("id");
      hist.push({t:now,by:myId,msg:"Cadastrado"});
    }else{
      const L=eqLabels(k), mud=c.campos.filter(f=>String(antes[f.k]??"")!==String(novo[f.k]??"")).map(f=>L[f.k]+": "+(antes[f.k]===undefined||antes[f.k]===""?"vazio":antes[f.k])+" → "+(novo[f.k]===""?"vazio":novo[f.k]));
      if(mud.length)hist.push({t:now,by:myId,msg:mud.join("; ")});
    }
    await db.doc(c.col+"/"+docId).set({...novo,historico:hist.slice(-200),updated:now});
    toast(id?"Alterações salvas":"Cadastrado");
    closeSheet(); setTimeout(()=>openEq(k,docId),400);
  }catch(e){err.textContent="Não foi possível salvar. Tente de novo.";err.hidden=false;btn.disabled=false}
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]"); if(!t)return; const a=t.dataset.a;
  if(a==="eqopen")openEq(t.dataset.k,t.dataset.id);
  else if(a==="eqgo"&&EQ[t.dataset.k]){const k=t.dataset.k;eqF[k]={q:"",local:"",status:t.dataset.s||""};setTab(k)}
  else if(a==="eqclose")eqClose();
  else if(a==="eqnew"&&canWrite&&EQ[tab])eqForm(tab,null);
  else if(a==="eqedit"&&canWrite&&eqCur)eqForm(eqCur.k,eqCur.id);
  else if(a==="eqcancel"){const c=eqCur;if(c&&c.id){closeSheet();openEq(c.k,c.id)}else eqClose()}
  else if(a==="eqsave")eqSave();
  else if(a==="eqdel"&&canWrite&&eqCur){
    if(!eqDel){eqDel=true;t.textContent="Confirmar exclusão";t.classList.add("on");setTimeout(()=>{if(eqDel&&t.isConnected){eqDel=false;t.textContent="Excluir";t.classList.remove("on")}},4000);return}
    const {k,id}=eqCur; eqDel=false;
    db.doc(EQ[k].col+"/"+id).delete().then(()=>{toast("Excluído");eqClose()}).catch(()=>toast("Não foi possível excluir."))}
});
document.addEventListener("input",e=>{if(e.target.id==="eq_q"&&EQ[tab]){eqF[tab].q=e.target.value;eqList(tab)}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset&&t.dataset.eq&&EQ[tab]){eqF[tab][t.dataset.eq]=t.value;eqList(tab)}});

/* ---------- inicialização ---------- */
function setRole(){const r=$("#role");r.hidden=false;const mr=myRole();r.textContent=mr?ROLES[mr]||mr:(canWrite?"Edição":"Somente leitura");r.className="chip"+(canWrite?"":" ro")}
if(MODULO){const bn=document.getElementById("brandname");if(bn)bn.textContent="Summa · TI";document.title="Summa · Setor de TI";
  const P=window.__PTI||{};
  /* logo do Summa no menu, no lugar do ícone e do nome */
  if(P.logo){const br=document.querySelector(".side .brand");if(br){const im=document.createElement("img");im.src=P.logo;im.alt="Summa Educação";im.style.cssText="height:38px;width:auto;max-width:100%;display:block";
    const sub=document.createElement("span");sub.textContent="Setor de TI";sub.style.marginTop="4px";const box=document.createElement("div");box.append(im,sub);br.replaceChildren(box)}}
  /* foto de perfil que veio do Summa */
  if(P.foto){const av=document.getElementById("av");if(av){const im=document.createElement("img");im.src=P.foto;im.alt="";im.style.cssText="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block";av.style.overflow="hidden";av.style.padding="0";av.replaceChildren(im)}}}
function renderAmenu(){
  const el=$("#amenu");
  const eu=(window.PTI&&PTI.user)||{};
  el.innerHTML=`<b>${esc(meName||eu.nome||"Minha conta")}</b><div class="am-s">${esc(eu.email||"")}${eu.email?" · ":""}${esc(ROLES[eu.role]||"")}</div>
  <div class="am-h">Conta</div>
  ${MODULO?`<a class="am" href="${esc(window.__PTI.summaUrl||"../index.php")}" style="text-decoration:none;color:inherit">Todos os módulos</a>`:`<button class="am" data-a="mypass">Alterar minha senha</button>`}
  <button class="am" data-a="logout" style="color:var(--crit)">Sair da conta</button>`;
}
function toggleAmenu(open){const el=$("#amenu"),b=$("#av");const o=open===undefined?el.hidden:open;if(o)renderAmenu();el.hidden=!o;b.setAttribute("aria-expanded",String(o))}
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  try{localStorage.setItem("pti-theme",t)}catch(e){}
  $("#theme").innerHTML=ic(t==="dark"?"sun":"moon");
}
async function boot(){
  let th=null; try{th=localStorage.getItem("pti-theme")}catch(e){}
  if(th!=="dark"&&th!=="light")th=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  applyTheme(th);
  const h=(location.hash||"").slice(1); if(TABS[h])tab=h;
  setTab(tab);
  const timer=setTimeout(()=>{if(!loaded){loadErr="Ainda sem resposta do banco de dados. Verifique a conexão.";render()}},10000);
  try{db=await claude.use("db"); userCap=await claude.use("user")}catch(e){db=null}
  if(!db){clearTimeout(timer);loadErr="Não foi possível carregar os dados. Recarregue a página ou entre de novo.";render();return}
  try{const cw=userCap?await userCap.can("data.write"):null;canSubmit=cw!==false}catch(e){canSubmit=true}
  try{const m=userCap?await userCap.me():null;if(m&&m.name){meName=m.name;if(!(MODULO&&window.__PTI&&window.__PTI.foto))$("#av").textContent=m.name.split(/\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase()}}catch(e){}
  try{isAdmin=!!(userCap&&((await userCap.isOwner())||(await userCap.canEdit())));myId=userCap?await userCap.id():null;realSuper=!!(userCap&&await userCap.isOwner());isSuper=realSuper&&!MODULO}catch(e){}
  realAdmin=isAdmin; try{sessionStorage.removeItem("pti-viewas")}catch(e){}
  canWrite=isAdmin; updateNav();
  setRole(); fab.hidden=!(canWrite&&(tab==="painel"||tab==="lista"));
  db.collection("users").onSnapshot(snap=>{reg=snap.docs.map(d=>({id:d.id,...d.data()}));setRole();updateNav();if(restricted()&&!["solicitar","ajuda"].includes(tab)){setTab("solicitar");return}
    if(tab==="usuarios"&&sheet.hidden&&!(document.activeElement&&/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)))viewUsuarios()},()=>{});
  db.collection("os").onSnapshot(sn=>{osReq=sn.docs.map(d=>({id:d.id,...d.data()}));refreshOps()},()=>{});
  ["redes","projetores"].forEach(k=>db.collection(k).onSnapshot(sn=>{eqData[k]=sn.docs.map(d=>({id:d.id,...d.data()}));eqRefresh(k)},()=>{}));
  db.collection("osx").onSnapshot(sn=>{osAdm={};sn.docs.forEach(d=>{osAdm[d.id]=d.data()});refreshOps()},()=>{});
  db.collection("manut").onSnapshot(sn=>{manut=sn.docs.map(d=>({id:d.id,...d.data()}));refreshOps()},()=>{});
  db.collection("pcs").onSnapshot(snap=>{
    clearTimeout(timer);
    pcs=snap.docs.map(d=>({id:d.id,...d.data()}));
    loaded=true; loadErr="";
    if(sheet.hidden){ if(tab==="lista"&&$("#results"))results(); else render(); }
  },err=>{clearTimeout(timer);loadErr="Não foi possível ler os dados ("+(err&&err.code||"erro")+").";render()});
}
boot();
})();
</script>
